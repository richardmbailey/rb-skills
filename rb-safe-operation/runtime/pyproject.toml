[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rb-safe-operation-runtime"
version = "0.3.0"
description = "Typed runtime for assessed low-level plan execution"
requires-python = ">=3.10"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-ai-slim[openai]==2.19.0",
    "openai==2.45.0",
    "tiktoken==0.12.0",
]

[project.scripts]
rb-safe-operation = "rb_safe_operation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rb_safe_operation = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
