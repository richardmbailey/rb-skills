[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["model.py"]

[tool.coverage.run]
branch = true
source = ["model"]

[tool.coverage.report]
show_missing = true
