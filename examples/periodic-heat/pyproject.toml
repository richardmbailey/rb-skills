[tool.ruff]
target-version = "py311"
line-length = 88
[tool.ruff.lint]
select = ["E", "F", "I"]
[tool.mypy]
python_version = "3.11"
strict = true
files = ["heat.py"]
[tool.coverage.run]
branch = true
source = ["heat"]
[tool.coverage.report]
show_missing = true
[tool.ruff.lint.isort]
known-first-party = ["heat"]
