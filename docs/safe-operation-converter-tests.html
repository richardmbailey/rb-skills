<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Deterministic browser-native tests for the local temperature converter.">
    <title>Temperature Converter Self-Tests</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef4f3;
        color: #173330;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
      }

      main {
        width: min(100%, 48rem);
        margin: 0 auto;
        border: 1px solid #c7d9d6;
        border-radius: 1rem;
        padding: 2rem;
        background: #ffffff;
      }

      h1 { margin-top: 0; }

      a { color: #145c53; }

      a:focus-visible {
        outline: 3px solid #f4a261;
        outline-offset: 3px;
      }

      .summary {
        border-radius: 0.75rem;
        padding: 1rem;
        font-weight: 750;
      }

      .summary[data-state="running"] { background: #edf3f2; }
      .summary[data-state="success"] { background: #dff5eb; color: #145c43; }
      .summary[data-state="error"] { background: #fff0ed; color: #9b2f23; }

      .results {
        display: grid;
        gap: 0.6rem;
        padding-left: 1.5rem;
      }

      .results li { padding-left: 0.35rem; }
      .results li[data-state="success"] { color: #145c43; }
      .results li[data-state="error"] { color: #9b2f23; font-weight: 700; }

      @media (max-width: 36rem) {
        body { padding: 0; background: #ffffff; }
        main { border: 0; border-radius: 0; padding: 1.5rem; }
      }
    </style>
  </head>
  <body>
    <main>
      <p><a href="safe-operation-converter.html">Return to the converter</a></p>
      <h1>Temperature converter self-tests</h1>
      <p>
        These deterministic checks run locally in this page against the same pure conversion API used by the converter.
      </p>
      <p id="test-summary" class="summary" data-state="running" aria-live="polite" aria-atomic="true">
        Running tests…
      </p>
      <ol id="test-results" class="results" aria-label="Individual test results"></ol>
      <noscript>
        <p class="summary" data-state="error">JavaScript is required to run these local self-tests.</p>
      </noscript>
    </main>

    <script src="safe-operation-converter-core.js"></script>
    <script>
      (function runConverterSelfTests() {
        "use strict";

        const converter = window.SafeOperationConverter;
        const summary = document.querySelector("#test-summary");
        const results = document.querySelector("#test-results");
        const DEFAULT_TOLERANCE = 1e-9;

        function assertNear(actual, expected, tolerance = DEFAULT_TOLERANCE) {
          if (!Number.isFinite(actual) || !Number.isFinite(expected) || !Number.isFinite(tolerance)) {
            throw new Error("Comparison values and tolerance must be finite.");
          }
          if (tolerance < 0 || Math.abs(actual - expected) > tolerance) {
            throw new Error(`Expected ${expected} ± ${tolerance}, received ${actual}.`);
          }
        }

        function expectError(callback, ErrorType) {
          try {
            callback();
          } catch (error) {
            if (error instanceof ErrorType) {
              return;
            }
            throw new Error(`Expected ${ErrorType.name}, received ${error.constructor.name}.`);
          }
          throw new Error(`Expected ${ErrorType.name}, but no error was thrown.`);
        }

        const tests = [
          { name: "Freezing: 0 °C equals 32 °F", run: () => assertNear(converter.convertTemperature(0, "C", "F"), 32) },
          { name: "Boiling: 100 °C equals 212 °F", run: () => assertNear(converter.convertTemperature(100, "C", "F"), 212) },
          { name: "Absolute zero: -273.15 °C equals 0 K", run: () => assertNear(converter.convertTemperature(-273.15, "C", "K"), 0) },
          { name: "Absolute zero: -459.67 °F equals -273.15 °C", run: () => assertNear(converter.convertTemperature(-459.67, "F", "C"), -273.15) },
          { name: "Absolute zero: -459.67 °F equals exactly 0 K", run: () => assertNear(converter.convertTemperature(-459.67, "F", "K"), 0, 0) },
          { name: "Identity conversion preserves 42 K", run: () => assertNear(converter.convertTemperature(42, "K", "K"), 42, 0) },
          { name: "NaN is rejected", run: () => expectError(() => converter.convertTemperature(Number.NaN, "C", "F"), TypeError) },
          { name: "Positive infinity is rejected", run: () => expectError(() => converter.convertTemperature(Number.POSITIVE_INFINITY, "C", "F"), TypeError) },
          { name: "Unknown units are rejected", run: () => expectError(() => converter.convertTemperature(10, "X", "C"), RangeError) },
          { name: "Below absolute zero is rejected", run: () => expectError(() => converter.convertTemperature(-273.16, "C", "K"), RangeError) },
          {
            name: "37 °C survives a Celsius-Fahrenheit-Celsius round trip within 1e-9",
            run: () => {
              const fahrenheit = converter.convertTemperature(37, "C", "F");
              const roundTrip = converter.convertTemperature(fahrenheit, "F", "C");
              assertNear(roundTrip, 37, 1e-9);
            },
          },
        ];

        let passed = 0;
        for (const test of tests) {
          const item = document.createElement("li");
          try {
            test.run();
            passed += 1;
            item.dataset.state = "success";
            item.textContent = `PASS: ${test.name}`;
          } catch (error) {
            item.dataset.state = "error";
            const detail = error instanceof Error ? error.message : "Unknown failure";
            item.textContent = `FAIL: ${test.name} — ${detail}`;
          }
          results.append(item);
        }

        const allPassed = passed === tests.length;
        summary.dataset.state = allPassed ? "success" : "error";
        summary.textContent = `${passed} of ${tests.length} tests passed.`;
      })();
    </script>
  </body>
</html>
