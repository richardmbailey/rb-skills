<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A private, dependency-free temperature converter.">
    <title>Safe Operation Temperature Converter</title>
    <link rel="stylesheet" href="safe-operation-converter.css">
    <script src="safe-operation-converter-core.js" defer></script>
    <script src="safe-operation-converter.js" defer></script>
  </head>
  <body>
    <main>
      <article class="converter-card" aria-labelledby="page-title">
        <header class="card-header">
          <p class="eyebrow">Safe-operation pilot</p>
          <h1 id="page-title">Temperature converter</h1>
          <p class="intro">
            Convert between Celsius, Fahrenheit, and Kelvin. Everything runs locally in this page.
          </p>
        </header>

        <form id="converter-form" novalidate>
          <div class="field-grid">
            <div class="field">
              <label for="source-value">Temperature</label>
              <input
                id="source-value"
                name="source-value"
                type="number"
                inputmode="decimal"
                step="any"
                placeholder="For example, 21"
                required
              >
            </div>

            <div class="field">
              <label for="source-unit">From</label>
              <select id="source-unit" name="source-unit">
                <option value="C">Celsius (°C)</option>
                <option value="F">Fahrenheit (°F)</option>
                <option value="K">Kelvin (K)</option>
              </select>
            </div>
          </div>

          <div class="target-row">
            <div class="field">
              <label for="target-unit">To</label>
              <select id="target-unit" name="target-unit">
                <option value="F">Fahrenheit (°F)</option>
                <option value="C">Celsius (°C)</option>
                <option value="K">Kelvin (K)</option>
              </select>
            </div>
            <button id="swap-units" class="secondary-button" type="button">Swap units</button>
          </div>

          <div class="actions">
            <button type="submit">Convert temperature</button>
          </div>
        </form>

        <section
          id="conversion-result"
          class="result"
          data-state="idle"
          aria-live="polite"
          aria-atomic="true"
        >
          Enter a value and choose Convert temperature.
        </section>

        <p><a href="safe-operation-converter-tests.html">Run converter self-tests</a></p>

        <noscript>
          <p class="result" data-state="error">JavaScript is required to run this local converter.</p>
        </noscript>
      </article>
    </main>
  </body>
</html>
