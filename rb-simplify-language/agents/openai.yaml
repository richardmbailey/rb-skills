interface:
  display_name: "RB Simplify Language"
  short_description: "Manually apply controlled instruction review"
  default_prompt: "Manual invocation only. Use $rb-simplify-language when the human explicitly requests it in Codex or Claude Code, or the authorised rb-write-skill post-draft procedure explicitly invokes it for that draft. Review agent-facing control text, or any text explicitly supplied by the human, while preserving intended behaviour. Do not select it automatically."
policy:
  allow_implicit_invocation: false
