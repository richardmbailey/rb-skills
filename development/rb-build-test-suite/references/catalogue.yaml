# Construction guidance is not executable authority. Module plans declare actual effects.
schema_version: 1.0.0
entries:
- number: 1
  id: unit
  name: Check isolated logic
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Verify a small function or module whose behaviour can be separated from external systems;
    useful for calculations, branching and validation.
  applicability: Verify a small function or module whose behaviour can be separated from external
    systems; useful for calculations, branching and validation.
  construction:
  - Derive cases from the contract; include normal, boundary and invalid inputs; control clocks and
    randomness; stub only external boundaries.
  tools:
  - pytest, unittest, JUnit, Vitest, QuickCheck
  evidence: Preserve case results, inputs and failures. Required behaviours and invariants must hold;
    numerical results use justified tolerances and appropriate scientific/reference checks.
  acceptance: Preserve case results, inputs and failures. Required behaviours and invariants must
    hold; numerical results use justified tolerances and appropriate scientific/reference checks.
  cost: Development/full; usually low cost. Quick runs changed logic and essential cases; standard
    runs the relevant suite; deep adds generated cases.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Keep fixtures local and disposable; require separate authority for external effects.
    `executable`.
  subtypes: []
  qualification: unsupported
- number: 2
  id: functional
  name: Check required behaviour
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Establish that a feature delivers its specified result through a public interface, including
    meaningful failure behaviour.
  applicability: Establish that a feature delivers its specified result through a public interface,
    including meaningful failure behaviour.
  construction:
  - Turn requirements into inputs and observable outcomes; exercise positive and negative paths and
    state transitions.
  tools:
  - pytest, REST Assured, Playwright, CLI harnesses
  evidence: Link each scenario to its requirement and actual outputs. Required outcomes, error handling
    and forbidden side effects must match the contract.
  acceptance: Link each scenario to its requirement and actual outputs. Required outcomes, error
    handling and forbidden side effects must match the contract.
  cost: Development/full; low to moderate cost. Quick covers critical changed paths; standard covers
    required variants; deep explores combinations.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Isolate accounts, files and service endpoints; sending or changing real user data requires
    authority. `executable`.
  subtypes: []
  qualification: unsupported
- number: 3
  id: component
  name: Check a subsystem through its boundary
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Test a cohesive service or subsystem with its internal parts connected while controlling
    dependencies outside its boundary.
  applicability: Test a cohesive service or subsystem with its internal parts connected while controlling
    dependencies outside its boundary.
  construction:
  - Start the real component; provide realistic dependency doubles or disposable services; exercise
    persistence, retries and malformed responses.
  tools:
  - Testcontainers, WireMock, framework test servers
  evidence: Record component versions, dependency contracts and observed state. Behaviour must satisfy
    the subsystem contract under success and specified failure modes.
  acceptance: Record component versions, dependency contracts and observed state. Behaviour must
    satisfy the subsystem contract under success and specified failure modes.
  cost: Development/full; moderate setup cost. Quick uses existing fixtures; standard covers component
    boundaries; deep adds recovery combinations.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Use disposable infrastructure and bounded resource limits; prevent accidental production
    connections. `executable`.
  subtypes: []
  qualification: unsupported
- number: 4
  id: fuzz
  name: Explore unexpected inputs
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Discover crashes, hangs and invariant violations in parsers, protocols, state machines
    or other large input spaces.
  applicability: Discover crashes, hangs and invariant violations in parsers, protocols, state machines
    or other large input spaces.
  construction:
  - Build a harness and oracle; seed valid and malformed examples; set time/resource limits; preserve
    and minimise discoveries.
  tools:
  - libFuzzer, AFL++, cargo-fuzz, Atheris
  evidence: Save harness, corpus, seeds, budget and reproducing inputs. No unresolved violation of
    the declared safety properties may remain within the explored scope; absence of findings is not
    exhaustive proof.
  acceptance: Save harness, corpus, seeds, budget and reproducing inputs. No unresolved violation
    of the declared safety properties may remain within the explored scope; absence of findings is
    not exhaustive proof.
  cost: Development/full; potentially high compute. Quick replays discoveries; standard uses bounded
    campaigns; deep expands budgets and states.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Sandbox dangerous parsers and cap filesystem/network effects; live target fuzzing needs
    explicit scope. `executable`.
  subtypes: []
  qualification: unsupported
- number: 5
  id: property_based
  name: Check rules across generated cases
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Verify general invariants, round trips and relationships where examples alone poorly cover
    the input space.
  applicability: Verify general invariants, round trips and relationships where examples alone poorly
    cover the input space.
  construction:
  - Specify independent properties; generate valid and invalid inputs; shrink failures; persist counterexamples.
  tools:
  - Hypothesis, QuickCheck, fast-check, proptest
  evidence: Record generators, seeds, example budgets and minimal failures. Properties must hold
    for explored cases; justify generators and scientific/metamorphic assumptions.
  acceptance: Record generators, seeds, example budgets and minimal failures. Properties must hold
    for explored cases; justify generators and scientific/metamorphic assumptions.
  cost: Development/full; low to high depending on the oracle. Quick replays failures; standard generates
    bounded cases; deep explores wider distributions.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Bound generated sizes and runtime; use disposable state for stateful properties. `executable`.
  subtypes:
  - analytical_reference
  - convergence
  - metamorphic
  - differential
  - empirical_validation
  qualification: unsupported
- number: 6
  id: formal_verification
  name: Prove a precisely stated property
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  - human_review
  purpose: Examine critical algorithms, protocols or policies where a formal model can express the
    important assumptions and guarantees.
  applicability: Examine critical algorithms, protocols or policies where a formal model can express
    the important assumptions and guarantees.
  construction:
  - Define the model, properties and environment assumptions; check counterexamples; connect the
    model to implementation obligations.
  tools:
  - TLA+/TLC, Alloy, Dafny, Lean, Coq, CBMC
  evidence: Preserve model, proof/checker output and bounds. Accept only the stated proven or exhaustively
    checked property within its assumptions; review abstraction and implementation correspondence
    separately.
  acceptance: Preserve model, proof/checker output and bounds. Accept only the stated proven or exhaustively
    checked property within its assumptions; review abstraction and implementation correspondence
    separately.
  cost: Development/full; often high expertise cost. Quick checks existing models; standard updates
    relevant properties; deep broadens modelling or proofs.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Local analysis usually has limited effects; do not describe a proof as authority to
    deploy. `executable`, `human_review`.
  subtypes:
  - analytical_reference
  - convergence
  - metamorphic
  - differential
  - empirical_validation
  qualification: unsupported
- number: 7
  id: static_analysis
  name: Find defects without running the program
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  - human_review
  purpose: Detect type, data-flow, security or API errors visible in source or intermediate representations.
  applicability: Detect type, data-flow, security or API errors visible in source or intermediate
    representations.
  construction:
  - Select language-aware analyzers; configure actual build context; review suppressions; compare
    findings with the established baseline.
  tools:
  - mypy, Pyright, CodeQL, Semgrep, compiler analyzers
  evidence: Retain analyzer configuration, version and findings. Resolve or explicitly disposition
    findings according to the project's reviewed policy; successful analysis does not prove runtime
    behaviour.
  acceptance: Retain analyzer configuration, version and findings. Resolve or explicitly disposition
    findings according to the project's reviewed policy; successful analysis does not prove runtime
    behaviour.
  cost: Development/full; low to moderate, sometimes high. Quick targets changed modules; standard
    covers the relevant graph; deep runs costly analyses.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Treat source upload and hosted scanning as separate data-sharing actions. `executable`,
    `human_review`.
  subtypes: []
  qualification: unsupported
- number: 8
  id: mutation
  name: Check whether tests detect plausible defects
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  - human_review
  purpose: Assess test sensitivity by making controlled code changes that should alter behaviour.
  applicability: Assess test sensitivity by making controlled code changes that should alter behaviour.
  construction:
  - Choose meaningful operators and scope; run tests against mutants; inspect survivors and equivalent
    mutants; add behaviour-focused tests.
  tools:
  - PIT, mutmut, Stryker
  evidence: Record killed, surviving, timed-out and excluded mutants with reasons. Required fault
    classes must be detected; interpret scores against a justified project target rather than a universal
    percentage.
  acceptance: Record killed, surviving, timed-out and excluded mutants with reasons. Required fault
    classes must be detected; interpret scores against a justified project target rather than a universal
    percentage.
  cost: Development/full; high repeated execution cost. Quick targets critical changed code; standard
    covers risk areas; deep expands operators and modules.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Mutate disposable copies; preserve source and never publish mutants. `executable`, `human_review`.
  subtypes: []
  qualification: unsupported
- number: 9
  id: coverage
  name: Identify code or requirements not exercised
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  - human_review
  purpose: Locate gaps in executed paths, conditions or requirement scenarios; coverage is supporting
    evidence, not proof of useful assertions.
  applicability: Locate gaps in executed paths, conditions or requirement scenarios; coverage is
    supporting evidence, not proof of useful assertions.
  construction:
  - Instrument relevant suites; map uncovered critical paths to scenarios; distinguish unreachable
    code from missing tests.
  tools:
  - coverage.py, JaCoCo, Istanbul, gcov
  evidence: Preserve reports and scope exclusions. Review critical gaps against the project's coverage
    policy and behavioural evidence; meeting a percentage alone does not establish adequacy.
  acceptance: Preserve reports and scope exclusions. Review critical gaps against the project's coverage
    policy and behavioural evidence; meeting a percentage alone does not establish adequacy.
  cost: Development/full; usually low overhead. Quick examines changes; standard measures suites;
    deep adds branch/condition or requirements coverage.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Instrument disposable builds; prevent sensitive source/report publication. `executable`,
    `human_review`.
  subtypes: []
  qualification: unsupported
- number: 10
  id: benchmark
  name: Measure a controlled workload repeatedly
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Compare algorithm or component speed and resource use under repeatable conditions.
  applicability: Compare algorithm or component speed and resource use under repeatable conditions.
  construction:
  - Define representative workloads; control warm-up and environment; repeat measurements; retain
    distributions and baseline identity.
  tools:
  - pytest-benchmark, Google Benchmark, JMH, hyperfine
  evidence: Record hardware, workload, samples and uncertainty. Assess against a requirement or justified
    baseline comparison; first measurements establish a baseline rather than inventing a pass limit.
  acceptance: Record hardware, workload, samples and uncertainty. Assess against a requirement or
    justified baseline comparison; first measurements establish a baseline rather than inventing
    a pass limit.
  cost: Development/full; moderate compute. Quick checks established small workloads; standard repeats
    representative cases; deep explores scale and variability.
  profile_hint: standard
  effects:
  - local_read
  - disposable_write
  authority: Reserve bounded compute and avoid interference with live services. `executable`.
  subtypes: []
  qualification: unsupported
- number: 11
  id: contract
  name: Check agreements between systems
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Detect incompatible API, event, file or consumer/provider changes, including semantics
    that schema checks miss.
  applicability: Detect incompatible API, event, file or consumer/provider changes, including semantics
    that schema checks miss.
  construction:
  - Capture consumer expectations; verify providers; test errors, optional fields and compatibility
    transitions.
  tools:
  - Pact, Schemathesis, OpenAPI validators, JSON Schema validators
  evidence: Preserve contract versions and provider/consumer results. Every required supported interaction
