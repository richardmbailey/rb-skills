- number: 12
  id: lint
  name: Enforce agreed source conventions
  original_phase: null
  original_phase_note: The available source text does not establish the original diagram grouping.
  focuses:
  - development
  - full
  kinds:
  - executable
  purpose: Catch mechanical mistakes and inconsistent conventions that have deterministic rules.
  applicability: Catch mechanical mistakes and inconsistent conventions that have deterministic rules.
  construction:
  - Use repository configuration; apply scoped rules; inspect exceptions; separate style findings
    from behavioural defects.
