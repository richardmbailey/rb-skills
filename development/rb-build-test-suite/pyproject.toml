[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "rb-test-suite"
version = "0.1.0"
description = "Project-specific test execution and evidence contracts for the RB suite-building skill"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "defusedxml==0.7.1",
  "jsonschema[format-nongpl]==4.26.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
