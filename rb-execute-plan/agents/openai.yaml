interface:
  display_name: "RB Execute Plan"
  short_description: "Execute plans with testing and proportionate review"
  default_prompt: "Use $rb-execute-plan to follow this approved plan linearly under standard conditions by default. Track implemented and verified tasks using automated behavioural tests and CI-equivalent evidence. Require independent sub-agent review for substantial, high-risk, or cross-cutting changes and existing explicit gates; use inline review for small local changes otherwise. Continue within existing authority. Use the constrained static-only route only when explicitly selected and preserve all of its gates."
