interface:
  display_name: "RB Execute Plan"
  short_description: "Execute plans with testing and independent review"
  default_prompt: "Use $rb-execute-plan to follow this approved implementation plan linearly under standard conditions by default unless I explicitly specify another route. Track every task as [ ] planned, [x] implemented, and [v] verified. Do not mark a task [v] until its automated behavioural tests or explicitly accepted exceptional evidence are recorded and an independent sub-agent review returns a favourable verdict from a reviewer that did not implement the task. Complete phase integration, CI-equivalent, and final review+fix gates. Stop and recommend $rb-sprint if evidence requires recurring PRD reconciliation or adaptive replanning. Use the constrained static-only route only when I explicitly select it and its criteria are typed and observable as static_file_state."
