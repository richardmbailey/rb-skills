interface:
  display_name: "RB Assess Plan Safety"
  short_description: "Assess a static-only constrained plan"
  default_prompt: "Use $rb-assess-plan-safety to assess the unchanged schema-3 plan envelope against its fixed project-policy binding, adapter capabilities, provider and run-resource grants, approvals, evidence, effects, and the closed verification-mode contract. Return safe false for any unsupported requirement, and state that bounded diff bytes still require execution-time preflight and fresh patch assessment."
