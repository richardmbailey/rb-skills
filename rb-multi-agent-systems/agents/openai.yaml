interface:
  display_name: "RB Multi-Agent Systems"
  short_description: "Design and test robust multi-agent systems"
  default_prompt: "Use $rb-multi-agent-systems to design or review this multi-agent architecture with the simplest sufficient control model, deterministic runner ownership, explicit permissions and state, and a concrete test selection covering transition, denial, contract, recovery, end-to-end, and held-out behaviour where relevant. Select checks for concrete failure boundaries; require actual worker dependencies and one owner for shared side effects, avoiding duplicate launches."
