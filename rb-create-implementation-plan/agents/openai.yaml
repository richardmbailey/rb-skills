interface:
  display_name: "RB Create Implementation Plan"
  short_description: "Plan phases, testing, and execution route"
  default_prompt: "Use $rb-create-implementation-plan to turn this sufficiently understood idea into a phased implementation plan. Include the exact [ ] planned, [x] implemented, and [v] verified legend, and prefix every actionable implementation task in every phase with exactly one state marker. Set new work to [ ]. Include testing architecture, CI-equivalent completion checks, risks and success criteria, use standard execution by default and explain constrained static-only execution only when requested or compared. For standard delivery, distinguish linear $rb-execute-plan from adaptive $rb-sprint."
