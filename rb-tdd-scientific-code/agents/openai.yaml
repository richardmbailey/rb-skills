interface:
  display_name: "RB TDD Scientific Code"
  short_description: "Test-drive scientific code across invariants and boundaries"
  default_prompt: "Use $rb-tdd-scientific-code to implement this scientific change test-first. Define units, tolerances, seeds and provenance; select the required test levels from unit, integration, benchmark, invariant and stochastic tests according to the changed model and its claims; run CI-equivalent checks; and preserve test integrity. Reuse valid numerical evidence and propose further experiments only when their outcomes could advance the requested conclusion or decision."
