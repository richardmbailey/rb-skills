name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            rb-safe-operation/runtime/build-requirements.lock
            rb-safe-operation/runtime/requirements.lock

      - name: Prepare validation evidence and Linux wheelhouse
        env:
          RB_WHEELHOUSE: ${{ runner.temp }}/rb-wheelhouse
        run: |
          mkdir -p validation-output/generated-schemas "$RB_WHEELHOUSE"
          python -m pip download --only-binary=:all: --require-hashes \
            --dest "$RB_WHEELHOUSE" -r rb-safe-operation/runtime/build-requirements.lock
          python -m pip download --only-binary=:all: --require-hashes \
            --dest "$RB_WHEELHOUSE" -r rb-safe-operation/runtime/requirements.lock
          sha256sum "$RB_WHEELHOUSE"/* | sort | tee validation-output/wheelhouse-sha256.txt

      - name: Install constrained runtime from reviewed locks
        env:
          RB_WHEELHOUSE: ${{ runner.temp }}/rb-wheelhouse
        run: |
          python -m pip install --no-index --find-links "$RB_WHEELHOUSE" --require-hashes \
            -r rb-safe-operation/runtime/build-requirements.lock
          python -m pip install --no-index --find-links "$RB_WHEELHOUSE" --require-hashes \
            -r rb-safe-operation/runtime/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e rb-safe-operation/runtime

      - name: Compile Python sources
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          python -m compileall -q \
            evals/skill-routing \
            rb-create-skill-evals/scripts \
            rb-safe-operation/runtime/src \
            rb-safe-operation/runtime/tests \
            2>&1 | tee validation-output/compile.txt

      - name: Validate JSON manifests and routing cases
        id: json
        continue-on-error: true
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee validation-output/json.txt
          import json
          from pathlib import Path

          patterns = (
              "evals/skill-routing/*.json",
              "evals/skill-routing/cases/*.json",
              "rb-*/evals/*.json",
          )
          paths = sorted({path for pattern in patterns for path in Path(".").glob(pattern)})
          if not paths:
              raise SystemExit("no JSON manifests or eval plans found")
          for path in paths:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"PASS: {path}")
          PY

      - name: Validate behavioural eval manifests
        id: evals
        continue-on-error: true
        run: |
          set -o pipefail
          {
            found=0
            for manifest in rb-*/evals/eval-plan.json; do
              if [[ -f "$manifest" ]]; then
                found=1
                python rb-create-skill-evals/scripts/validate_eval_manifest.py "$manifest"
              fi
            done
            if [[ "$found" -eq 0 ]]; then
              echo "no behavioural eval manifests found" >&2
              exit 1
            fi
          } 2>&1 | tee validation-output/eval-manifests.txt

      - name: Run skill regression tests
        id: skill_regressions
        continue-on-error: true
        run: |
          set -o pipefail
          python -m unittest discover -s evals/skill-routing/tests -p 'test_*.py' \
            2>&1 | tee validation-output/skill-regressions.txt

      - name: Validate skill metadata
        id: metadata
        continue-on-error: true
        run: |
          set -o pipefail
          ruby evals/skill-routing/validate_skill_metadata.rb \
            2>&1 | tee validation-output/skill-metadata.txt

      - name: Validate instruction contracts
        id: instructions
        continue-on-error: true
        run: |
          set -o pipefail
          python evals/skill-routing/validate_instruction_contracts.py \
            evals/skill-routing/instruction-contracts.json \
            2>&1 | tee validation-output/instruction-contracts.txt

      - name: Validate cross-file consistency
        id: consistency
        continue-on-error: true
        run: |
          set -o pipefail
          python evals/skill-routing/validate_consistency_contracts.py \
            evals/skill-routing/consistency-contracts.json \
            2>&1 | tee validation-output/consistency-contracts.txt

      - name: Validate publication hygiene
        id: publication
        continue-on-error: true
        run: |
          set -o pipefail
          python evals/skill-routing/validate_publication_hygiene.py \
            2>&1 | tee validation-output/publication-hygiene.txt

      - name: Run constrained-runtime tests including setup and tamper gates
        id: runtime
        continue-on-error: true
        env:
          RB_SAFE_OPERATION_TEST_WHEELHOUSE: ${{ runner.temp }}/rb-wheelhouse
        run: |
          set -o pipefail
          python -m unittest discover -s rb-safe-operation/runtime/tests -p 'test_*.py' \
            2>&1 | tee validation-output/runtime-tests.txt
          if grep -q 'skipped=' validation-output/runtime-tests.txt; then
            echo 'skipped runtime tests are not allowed in the primary validation job' >&2
            exit 1
          fi

      - name: Export and check generated schemas
        id: schemas
        continue-on-error: true
        run: |
          set -o pipefail
          python -m rb_safe_operation.cli export-schemas \
            --destination validation-output/generated-schemas \
            > validation-output/schema-export.json
          python -m rb_safe_operation.cli check-schema-drift \
            --expected rb-safe-operation/references/generated \
            2>&1 | tee validation-output/schema-drift.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validation-output
          path: validation-output/
          if-no-files-found: error

      - name: Fail for validation errors
        if: always()
        run: |
          outcomes=(
            "${{ steps.compile.outcome }}"
            "${{ steps.json.outcome }}"
            "${{ steps.evals.outcome }}"
            "${{ steps.skill_regressions.outcome }}"
            "${{ steps.metadata.outcome }}"
            "${{ steps.instructions.outcome }}"
            "${{ steps.consistency.outcome }}"
            "${{ steps.publication.outcome }}"
            "${{ steps.runtime.outcome }}"
            "${{ steps.schemas.outcome }}"
          )
          printf 'Validation outcomes: %s\n' "${outcomes[*]}"
          for outcome in "${outcomes[@]}"; do
            if [[ "$outcome" != "success" ]]; then
              exit 1
            fi
          done

  runtime-python-floor:
    name: Runtime on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            rb-safe-operation/runtime/build-requirements.lock
            rb-safe-operation/runtime/requirements.lock

      - name: Install exact runtime dependencies
        run: |
          python -m pip install --require-hashes \
            -r rb-safe-operation/runtime/build-requirements.lock
          python -m pip install --require-hashes \
            -r rb-safe-operation/runtime/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e rb-safe-operation/runtime

      - name: Compile runtime
        run: python -m compileall -q rb-safe-operation/runtime/src rb-safe-operation/runtime/tests

      - name: Run runtime tests
        run: python -m unittest discover -s rb-safe-operation/runtime/tests -p 'test_*.py'
